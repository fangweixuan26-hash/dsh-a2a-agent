# ──────────────────────────────────────────────────────────────────────────────
# dsh-a2a-agent — usage reference
#
# This project is a DeepSeek Harness dynamic Cordis Plugin: two halves that
# map directly onto the `code.host` and `code.client` fields of the
# `cordis_define` tool.
#
#   host.js    ->  code.host     (A2A endpoints + get-status RPC)
#   client.js  ->  code.client   (status card in the cordis Run card)
# ──────────────────────────────────────────────────────────────────────────────

# 1. Load the source:
#
#    host   = <contents of host.js>
#    client = <contents of client.js>
#
# 2. Define and run:
#
#    cordis_define(plugin: {kind:"new", idPrefix:"bridge"},
#                  name: "A2A Protocol Server",
#                  purpose: "Expose this agent over A2A",
#                  code: { host, client })
#    cordis_run(...)
#
# 3. After the Run completes, the card shows:
#      - JSON-RPC endpoint URL   (e.g. http://127.0.0.1:3080/a2a)
#      - Agent Card URL          (http://127.0.0.1:3080/.well-known/agent.json)
#      - received-message count and live task count
#
#    curl http://127.0.0.1:3080/.well-known/agent.json
#    curl http://127.0.0.1:3080/a2a -H 'Content-Type: application/json' \
#      -d '{"jsonrpc":"2.0","id":1,"method":"message/send","params":{"message":{"messageId":"m1","role":"user","parts":[{"kind":"text","text":"hi"}]}}}'
